# RT-DETR Training Configuration
model:
  name: "RT-DETR"
  variant: "rtdetr-l.pt"
  pretrained: true

training:
  epochs: 80
  patience: 10
  imgsz: 640
  batch_size: 16
  workers: 4
  optimizer: "AdamW"
  lr0: 0.0001
  lrf: 0.01
  weight_decay: 0.0001
  device: 0
  seed: 42
  save: true
  save_period: 1
  val: true

evaluation:
  eval_conf: 0.01      # Confidence threshold for COCO mAP evaluation
  cm_conf: 0.25        # Confidence threshold for Confusion Matrix
  iou_step: 0.05       # IoU step for mAP@50-95 (0.50:0.05:0.95)
  benchmark_warmup: 20 # Warmup iterations for latency/FPS measurement

loss_weights:
  box: 7.5
  cls: 0.5
  dfl: 1.5

outputs:
  checkpoint_dir: "/vol/checkpoints/rtdetr"
  log_dir: "/vol/logs/rtdetr"
  eval_dir: "/vol/outputs/rtdetr_eval"
